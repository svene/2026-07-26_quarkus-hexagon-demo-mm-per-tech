<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Supermarket – Products</title>
</head>
<body>
<h1>Supermarket – Products</h1>

{#if products.isEmpty()}<p>No products in inventory yet.</p>{/if}
{#if !products.isEmpty()}
<table border="1" cellpadding="6">
    <thead>
        <tr><th>Name</th><th>Type</th><th>Available</th></tr>
    </thead>
    <tbody>
        {#for p in products}
        <tr>
            <td>{p.name}</td>
            <td>{p.type}</td>
            <td>{p.availableAmount}</td>
        </tr>
        {/for}
    </tbody>
</table>
{/if}

<h2>Order Fruits</h2>
<form method="post" action="/products/order-fruits">
    <input name="productName" placeholder="Product name" required>
    <input name="quantity" type="number" placeholder="Quantity" min="1" required>
    <button type="submit">Order</button>
</form>

<h2>Order Beverages</h2>
<form method="post" action="/products/order-beverages">
    <input name="productName" placeholder="Product name" required>
    <input name="quantity" type="number" placeholder="Quantity" min="1" required>
    <button type="submit">Order</button>
</form>
</body>
</html>
