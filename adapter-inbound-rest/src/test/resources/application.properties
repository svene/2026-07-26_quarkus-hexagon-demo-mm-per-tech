# CDI bean scanning for every module on the test classpath.
# Required because Quarkus only auto-indexes the current module;
# dependency JARs need explicit registration.
quarkus.index-dependency.core.group-id=org.svenehrke.demo
quarkus.index-dependency.core.artifact-id=core
quarkus.index-dependency.postgres.group-id=org.svenehrke.demo
quarkus.index-dependency.postgres.artifact-id=adapter-outbound-postgres
quarkus.index-dependency.mongodb.group-id=org.svenehrke.demo
quarkus.index-dependency.mongodb.artifact-id=adapter-outbound-mongodb
quarkus.index-dependency.kafka-producer.group-id=org.svenehrke.demo
quarkus.index-dependency.kafka-producer.artifact-id=adapter-outbound-kafka-producer
quarkus.index-dependency.webservice.group-id=org.svenehrke.demo
quarkus.index-dependency.webservice.artifact-id=adapter-outbound-webservice
quarkus.index-dependency.httpclient.group-id=org.svenehrke.demo
quarkus.index-dependency.httpclient.artifact-id=adapter-outbound-httpclient

# Postgres - Dev Services provides the connection automatically
quarkus.hibernate-orm.database.generation=drop-and-create

# MongoDB - Dev Services provides the connection automatically; database name is required
quarkus.mongodb.database=hexdemo

# Kafka outgoing channel for inventory events (Dev Services starts Redpanda)
mp.messaging.outgoing.inventory-events.topic=inventory-events
mp.messaging.outgoing.inventory-events.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# REST clients: both point to the WireMock Dev Service.
# The WireMock extension injects quarkus.wiremock.devservices.port (not a full URL).
# The stub in adapter-outbound-webservice (wiremock/mappings/beverage-orders.json)
# matches POST /orders and handles both fruit and beverage order calls.
quarkus.rest-client.fruit-supplier.url=http://localhost:${quarkus.wiremock.devservices.port}
quarkus.rest-client.beverage-supplier.url=http://localhost:${quarkus.wiremock.devservices.port}
