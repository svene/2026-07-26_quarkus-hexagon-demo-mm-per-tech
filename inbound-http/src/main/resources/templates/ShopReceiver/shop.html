<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Supermarket – Shop</title>
    <link rel="stylesheet" href="/css/bulma.min.css">
    <script src="/js/htmx.org/2.0.8/htmx.js"></script>
</head>
<body>
<section class="section">
<div class="container">
    <h1 class="title">Supermarket – Shop</h1>

    {#if products.isEmpty()}
    <p class="has-text-grey"><em>No products available to purchase right now.</em></p>
    {/if}

    {#if !products.isEmpty()}
    <div hx-get="/shop/inventory-fragment" hx-trigger="every 3s" hx-swap="none"></div>

    <form method="post" action="/shop/checkout" id="shop-form">
        <table class="table is-fullwidth is-striped">
            <thead>
                <tr><th>Name</th><th>Type</th><th>Available</th><th>Qty to buy</th></tr>
            </thead>
            <tbody>
                {#for p in products}
                <tr>
                    <td>{p.name}</td>
                    <td>{p.type}</td>
                    <td id="avail-{p.name}">{p.availableAmount}</td>
                    <td>
                        <input type="hidden" name="productName" value="{p.name}">
                        <input type="number" name="quantity" class="input qty-input" min="0" max="{p.availableAmount}" data-max="{p.availableAmount}" value="" style="width:100px">
                    </td>
                </tr>
                {/for}
            </tbody>
        </table>
        <div class="field is-grouped">
            <div class="control"><button class="button is-link" type="submit">Purchase</button></div>
            <div class="control"><button class="button is-light" type="button" id="randomize-btn">Randomize (dev)</button></div>
        </div>
    </form>
    {/if}
</div>
</section>

<script>
document.getElementById('randomize-btn')?.addEventListener('click', function () {
    var inputs = Array.from(document.querySelectorAll('.qty-input'));
    inputs.forEach(function (input) { input.value = ''; });
    if (inputs.length === 0) return;

    var count = Math.min(inputs.length, 2 + Math.floor(Math.random() * 3)); // 2-4
    var shuffled = inputs.slice().sort(function () { return Math.random() - 0.5; });
    shuffled.slice(0, count).forEach(function (input) {
        var max = Math.min(parseInt(input.dataset.max, 10) || 1, 10);
        input.value = 1 + Math.floor(Math.random() * max);
    });
});
</script>

</body>
</html>
