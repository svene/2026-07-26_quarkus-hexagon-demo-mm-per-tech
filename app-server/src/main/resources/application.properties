# app-server configuration
#
# No datasource, mongodb, or kafka.bootstrap.servers are set on purpose:
# Quarkus Dev Services detects the corresponding extensions on the classpath
# and auto-starts real containers (Postgres, MongoDB, Redpanda/Kafka) for
# dev mode (mvn quarkus:dev) and tests. Requires Docker/Podman running.

quarkus.application.name=quarkus-hexagon-demo-mm-per-tech-server

# --- Postgres (adapter-outbound-postgres) ---
quarkus.hibernate-orm.database.generation=drop-and-create

# --- Kafka (adapter-inbound-kafka / adapter-outbound-kafka-producer) ---
# Example channel config - adjust once you define your actual topics:
# mp.messaging.incoming.orders-in.topic=orders
# mp.messaging.outgoing.orders-out.topic=orders-events

# --- WireMock (adapter-outbound-webservice) ---
# Quarkiverse WireMock Dev Services auto-starts a WireMock container in dev/test
# mode and injects its base URL. Point your REST client config key at it, e.g.:
# quarkus.rest-client.partner-webservice-api.url=${quarkus.wiremock.devservices.url}

# --- Remote HTTP client (adapter-outbound-httpclient) ---
# quarkus.rest-client.remote-service-api.url=http://localhost:9000
