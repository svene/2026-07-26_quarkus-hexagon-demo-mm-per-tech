# app-server configuration
#
# No datasource, mongodb, or kafka.bootstrap.servers are set on purpose:
# Quarkus Dev Services detects the corresponding extensions on the classpath
# and auto-starts real containers (Postgres, MongoDB, Redpanda/Kafka) for
# dev mode (mvn quarkus:dev) and tests. Requires Docker/Podman running.

quarkus.application.name=quarkus-hexagon-demo-mm-per-tech-server

# --- Postgres (adapter-outbound-postgres) ---
quarkus.hibernate-orm.database.generation=drop-and-create

# --- Kafka inbound: fruit and beverage delivery notifications ---
mp.messaging.incoming.fruit-deliveries.topic=fruit-deliveries
mp.messaging.incoming.fruit-deliveries.value.deserializer=com.example.hexdemo.adapter.inbound.kafka.DeliveryMessageDeserializer

mp.messaging.incoming.beverages-deliveries.topic=beverages-deliveries
mp.messaging.incoming.beverages-deliveries.value.deserializer=com.example.hexdemo.adapter.inbound.kafka.DeliveryMessageDeserializer

# --- Kafka outbound: inventory change events ---
mp.messaging.outgoing.inventory-events.topic=inventory-events
mp.messaging.outgoing.inventory-events.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# --- MongoDB (adapter-outbound-mongodb) ---
# Dev Services starts a container but does not inject a database name.
quarkus.mongodb.database=hexdemo

# --- REST client: fruit supplier (adapter-outbound-httpclient) ---
quarkus.rest-client.fruit-supplier.url=http://localhost:9001
%dev.quarkus.rest-client.fruit-supplier.url=http://localhost:${quarkus.wiremock.devservices.port}
%test.quarkus.rest-client.fruit-supplier.url=http://localhost:${quarkus.wiremock.devservices.port}

# --- REST client: beverage supplier (adapter-outbound-webservice) ---
quarkus.rest-client.beverage-supplier.url=http://localhost:9002
%dev.quarkus.rest-client.beverage-supplier.url=http://localhost:${quarkus.wiremock.devservices.port}
%test.quarkus.rest-client.beverage-supplier.url=http://localhost:${quarkus.wiremock.devservices.port}
