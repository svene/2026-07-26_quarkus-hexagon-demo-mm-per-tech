mp.messaging.outgoing.cashpoint-purchases-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Inbound: the stores' occupancy (door counters, tills), reported by the checkout systems every 5 s per store.
# Keyed by store id: a state snapshot, not an event - only the latest per store counts, so the topic could be compacted
# (cleanup.policy=compact; not configured here, see architecture-flow-kafka-reference.md).
mp.messaging.incoming.store-occupancy.topic=store-occupancy
mp.messaging.incoming.store-occupancy.value.deserializer=org.svenehrke.triptychdemo.cross.occupancy.OccupancyMessageDeserializer
mp.messaging.incoming.store-occupancy.fail-on-deserialization-failure=false
mp.messaging.incoming.store-occupancy.failure-strategy=dead-letter-or-fail-stop
mp.messaging.incoming.store-occupancy.dead-letter-queue.topic=store-occupancy-dlq
mp.messaging.incoming.store-occupancy.dead-letter-queue.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Outgoing channel used only in tests to publish occupancy reports onto Kafka
mp.messaging.outgoing.testing-store-occupancy-out.connector=smallrye-kafka
mp.messaging.outgoing.testing-store-occupancy-out.topic=store-occupancy
mp.messaging.outgoing.testing-store-occupancy-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

