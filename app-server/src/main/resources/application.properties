# app-server configuration
#
# No datasource, mongodb, or kafka.bootstrap.servers are set on purpose:
# Quarkus Dev Services detects the corresponding extensions on the classpath
# and auto-starts real containers (Postgres, MongoDB, Redpanda/Kafka) for
# dev mode (mvn quarkus:dev) and tests. Requires Docker/Podman running.

quarkus.application.name=quarkus-hexagon-demo-mm-per-tech-server

# --- Postgres (outbound-postgres) ---
quarkus.hibernate-orm.database.generation=drop-and-create

# =============================================================================
# Kafka inbound: delivery notifications from each supplier
# =============================================================================

mp.messaging.incoming.fruit-deliveries.topic=fruit-deliveries
mp.messaging.incoming.fruit-deliveries.value.deserializer=com.example.hexademo.adapter.inbound.kafka.DeliveryMessageDeserializer

mp.messaging.incoming.vegetables-deliveries.topic=vegetables-deliveries
mp.messaging.incoming.vegetables-deliveries.value.deserializer=com.example.hexademo.adapter.inbound.kafka.DeliveryMessageDeserializer

mp.messaging.incoming.dairy-deliveries.topic=dairy-deliveries
mp.messaging.incoming.dairy-deliveries.value.deserializer=com.example.hexademo.adapter.inbound.kafka.DeliveryMessageDeserializer

mp.messaging.incoming.beverages-deliveries.topic=beverages-deliveries
mp.messaging.incoming.beverages-deliveries.value.deserializer=com.example.hexademo.adapter.inbound.kafka.DeliveryMessageDeserializer

mp.messaging.incoming.meat-deliveries.topic=meat-deliveries
mp.messaging.incoming.meat-deliveries.value.deserializer=com.example.hexademo.adapter.inbound.kafka.DeliveryMessageDeserializer

mp.messaging.incoming.bakery-deliveries.topic=bakery-deliveries
mp.messaging.incoming.bakery-deliveries.value.deserializer=com.example.hexademo.adapter.inbound.kafka.DeliveryMessageDeserializer

mp.messaging.incoming.nonfood-deliveries.topic=nonfood-deliveries
mp.messaging.incoming.nonfood-deliveries.value.deserializer=com.example.hexademo.adapter.inbound.kafka.DeliveryMessageDeserializer

# Inbound: cashpoint purchase events from external checkout systems
mp.messaging.incoming.cashpoint-purchases.topic=cashpoint-purchases
mp.messaging.incoming.cashpoint-purchases.value.deserializer=com.example.hexademo.adapter.inbound.kafka.DeliveryMessageDeserializer

# Outgoing channel used only in tests to publish cashpoint purchase events onto Kafka
mp.messaging.outgoing.testing-cashpoint-purchases-out.connector=smallrye-kafka
mp.messaging.outgoing.testing-cashpoint-purchases-out.topic=cashpoint-purchases
mp.messaging.outgoing.testing-cashpoint-purchases-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.outgoing.cashpoint-purchases-out.connector=smallrye-kafka
mp.messaging.outgoing.cashpoint-purchases-out.topic=cashpoint-purchases
mp.messaging.outgoing.cashpoint-purchases-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# =============================================================================
# Kafka outbound: inventory change events
# =============================================================================

mp.messaging.outgoing.inventory-events.topic=inventory-events
mp.messaging.outgoing.inventory-events.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.incoming.inventory-events-consumer.connector=smallrye-kafka
mp.messaging.incoming.inventory-events-consumer.topic=inventory-events
mp.messaging.incoming.inventory-events-consumer.value.deserializer=com.example.hexademo.external.inbound.kafka.cashpoint.InventoryEventDeserializer

# =============================================================================
# Kafka outbound channels for REST supplier stubs (external-rest-supplier-stub)
# The -out suffix distinguishes the outgoing emitter channel from the incoming
# consumer channel that shares the same Kafka topic name.
# =============================================================================

mp.messaging.outgoing.fruit-deliveries-out.connector=smallrye-kafka
mp.messaging.outgoing.fruit-deliveries-out.topic=fruit-deliveries
mp.messaging.outgoing.fruit-deliveries-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.outgoing.vegetables-deliveries-out.connector=smallrye-kafka
mp.messaging.outgoing.vegetables-deliveries-out.topic=vegetables-deliveries
mp.messaging.outgoing.vegetables-deliveries-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.outgoing.dairy-deliveries-out.connector=smallrye-kafka
mp.messaging.outgoing.dairy-deliveries-out.topic=dairy-deliveries
mp.messaging.outgoing.dairy-deliveries-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# =============================================================================
# Kafka outbound channels for SOAP supplier stubs (external-soap-supplier-stub)
# =============================================================================

mp.messaging.outgoing.beverages-deliveries-out.connector=smallrye-kafka
mp.messaging.outgoing.beverages-deliveries-out.topic=beverages-deliveries
mp.messaging.outgoing.beverages-deliveries-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.outgoing.meat-deliveries-out.connector=smallrye-kafka
mp.messaging.outgoing.meat-deliveries-out.topic=meat-deliveries
mp.messaging.outgoing.meat-deliveries-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.outgoing.bakery-deliveries-out.connector=smallrye-kafka
mp.messaging.outgoing.bakery-deliveries-out.topic=bakery-deliveries
mp.messaging.outgoing.bakery-deliveries-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# =============================================================================
# Kafka channels for the non-food Kafka supplier
# (outbound-kafka-supplier → nonfood-orders → external-kafka-supplier-stub
#  → nonfood-deliveries → inbound-kafka NonFoodDeliveryReceiver)
# =============================================================================

# App places non-food orders onto Kafka
mp.messaging.outgoing.nonfood-orders-out.connector=smallrye-kafka
mp.messaging.outgoing.nonfood-orders-out.topic=nonfood-orders
mp.messaging.outgoing.nonfood-orders-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# NonFoodSupplierStub consumes orders
mp.messaging.incoming.nonfood-orders.topic=nonfood-orders
mp.messaging.incoming.nonfood-orders.value.deserializer=com.example.hexademo.external.outbound.kafka.nonfood.NonFoodOrderMessageDeserializer

# NonFoodSupplierStub sends delivery notifications
mp.messaging.outgoing.nonfood-deliveries-out.connector=smallrye-kafka
mp.messaging.outgoing.nonfood-deliveries-out.topic=nonfood-deliveries
mp.messaging.outgoing.nonfood-deliveries-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# =============================================================================
# MongoDB (outbound-mongodb)
# =============================================================================

quarkus.mongodb.database=hexdemo

# =============================================================================
# REST clients (outbound-httpclient)
# All three REST supplier stubs run in the same Quarkus process in dev/test.
# =============================================================================

quarkus.rest-client.fruit-supplier.url=http://localhost:9001
%dev.quarkus.rest-client.fruit-supplier.url=http://localhost:${quarkus.http.port}
%test.quarkus.rest-client.fruit-supplier.url=http://localhost:${quarkus.http.test-port}

quarkus.rest-client.vegetables-supplier.url=http://localhost:9001
%dev.quarkus.rest-client.vegetables-supplier.url=http://localhost:${quarkus.http.port}
%test.quarkus.rest-client.vegetables-supplier.url=http://localhost:${quarkus.http.test-port}

quarkus.rest-client.dairy-supplier.url=http://localhost:9001
%dev.quarkus.rest-client.dairy-supplier.url=http://localhost:${quarkus.http.port}
%test.quarkus.rest-client.dairy-supplier.url=http://localhost:${quarkus.http.test-port}

# =============================================================================
# SOAP (outbound-webservice + external-soap-supplier-stub)
# All SOAP supplier stubs run in the same Quarkus process in dev/test.
# =============================================================================

quarkus.cxf.path=/soap

# Beverage supplier client
quarkus.cxf.client."beverage-supplier".service-interface=com.example.hexademo.adapter.outbound.webservice.BeverageOrderService
quarkus.cxf.client."beverage-supplier".client-endpoint-url=http://localhost:9002/soap/beverage-supplier
%dev.quarkus.cxf.client."beverage-supplier".client-endpoint-url=http://localhost:${quarkus.http.port}/soap/beverage-supplier
%test.quarkus.cxf.client."beverage-supplier".client-endpoint-url=http://localhost:${quarkus.http.test-port}/soap/beverage-supplier

# Meat supplier client
quarkus.cxf.client."meat-supplier".service-interface=com.example.hexademo.adapter.outbound.webservice.MeatOrderService
quarkus.cxf.client."meat-supplier".client-endpoint-url=http://localhost:9002/soap/meat-supplier
%dev.quarkus.cxf.client."meat-supplier".client-endpoint-url=http://localhost:${quarkus.http.port}/soap/meat-supplier
%test.quarkus.cxf.client."meat-supplier".client-endpoint-url=http://localhost:${quarkus.http.test-port}/soap/meat-supplier

# Bakery supplier client
quarkus.cxf.client."bakery-supplier".service-interface=com.example.hexademo.adapter.outbound.webservice.BakeryOrderService
quarkus.cxf.client."bakery-supplier".client-endpoint-url=http://localhost:9002/soap/bakery-supplier
%dev.quarkus.cxf.client."bakery-supplier".client-endpoint-url=http://localhost:${quarkus.http.port}/soap/bakery-supplier
%test.quarkus.cxf.client."bakery-supplier".client-endpoint-url=http://localhost:${quarkus.http.test-port}/soap/bakery-supplier

# SOAP server stubs
quarkus.cxf.endpoint."/beverage-supplier".implementor=com.example.hexademo.external.outbound.soap.beverage.BeverageSupplierStub
quarkus.cxf.endpoint."/meat-supplier".implementor=com.example.hexademo.external.outbound.soap.meat.MeatSupplierStub
quarkus.cxf.endpoint."/bakery-supplier".implementor=com.example.hexademo.external.outbound.soap.bakery.BakerySupplierStub
