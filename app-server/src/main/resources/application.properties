# app-server configuration
#
# No datasource, mongodb, or kafka.bootstrap.servers are set on purpose:
# Quarkus Dev Services detects the corresponding extensions on the classpath
# and auto-starts real containers (Postgres, MongoDB, Redpanda/Kafka) for
# dev mode (mvn quarkus:dev) and tests. Requires Docker/Podman running.

quarkus.application.name=quarkus-hexagon-demo-mm-per-tech-server

# --- Postgres (outbound-postgres) ---
# The schema comes from Flyway migrations (outbound-postgres src/main/resources/db/migration), so the data survives
# restarts and dev-mode live reloads (and its ids keep counting up - Kafka messages that outlive a reload, e.g. a
# shipment arrival, never meet a reused id). The adapter uses plain SQL; the flow tests run every query against the
# migrated schema, so a schema change without its migration fails the build.
quarkus.flyway.migrate-at-start=true
# Tests start every app (one per test profile) on an empty schema; the tests reset their rows in @BeforeEach anyway.
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.clean-disabled=false

# --- Automatic replenishment and purchasing (inbound-event) ---
# A demand period is a demo "day": at its end the reorder levels are learned from the period's demand
# (DemandPeriodReceiver), the stores and the online FC request from the DC what has fallen below them
# (AutoReplenishmentReceiver), and the DC orders from the suppliers what has fallen below its levels
# (AutoPurchasingReceiver - separate switch, so a flow test can turn on one stage only). Off in tests and in the e2e dev server (playwright.config.ts), where stock must
# only move when a test moves it; flow tests close the period by calling ReorderPolicyHandler directly.
inventory.demand-period=1m
# The first period close comes one period after the start (DemandPeriodReceiver), not right away. Must be a duration
# even where the period is off.
inventory.first-period-close-delay=1m
inventory.auto-replenishment.enabled=true
inventory.auto-purchasing.enabled=true
%test.inventory.demand-period=off
%test.inventory.auto-replenishment.enabled=false
%test.inventory.auto-purchasing.enabled=false

# --- Seeding the DC (DcSeedReceiver, inbound-event) ---
# An empty DC (after a start or the admin reset: no stock, no open supplier order) orders this many of every catalog
# product from the suppliers, so the demo runs on its own. Checked startup-delay after the start (once the HTTP server
# listens: the supplier stubs run in the same app), right after a reset and at every period close. Off in tests and in
# the e2e dev server (playwright.config.ts), which expect an empty inventory after their reset.
inventory.dc-seed.enabled=true
inventory.dc-seed.quantity=500
inventory.dc-seed.startup-delay=5s
%test.inventory.dc-seed.enabled=false

# --- Supplier stubs (external-outbound-*) ---
# Lead time: a stub delivers an order this long (± 20%) after it was placed, so supplier orders stay OPEN for a while
# and the DC's inventory position counts them. 0 in tests and in the e2e dev server (playwright.config.ts), where a
# delivery should follow its order right away.
supplier-stub.lead-time=30s
%test.supplier-stub.lead-time=0s

# --- Cashpoint stub (external-inbound-kafka): the checkout systems of the physical stores ---
# Per store a simulation of its customers (StoreSimulation): they arrive along a rush-hour curve over the demo day
# (0.3-2.5x what the configured tills serve), shop for 30-60 real minutes (compressed to the demo day of 1 min, like
# inventory.demand-period) and pay at a till - one purchase per paying customer. The till time is the one value set in
# demo time, not compressed: the tills throttle the purchases (at most tills / till-time). At the rush hour the till
# queue grows until the store is full (capacity); who arrives then turns away - a lost sale. The capacities are small
# since a stay is only 1.25-2.5 s: most customers inside are queuing or paying.
# Every 5 s (and right after a till change) each store reports its occupancy on the store-occupancy topic.
# The tills can be opened/closed on /locations: the arrivals stay scaled to the configured number (the store's demand),
# so an extra till lets more of them in - fewer turned away, more sales.
# Off (tick=off) in tests and in the e2e dev server (playwright.config.ts), where only the tests move stock.
cashpoint-stub.tick=100ms
cashpoint-stub.day=1m
cashpoint-stub.till-time=15s
cashpoint-stub.stores.zurich.capacity=16
cashpoint-stub.stores.zurich.tills=4
cashpoint-stub.stores.basel.capacity=10
cashpoint-stub.stores.basel.tills=2
cashpoint-stub.stores.bern.capacity=6
cashpoint-stub.stores.bern.tills=1
%test.cashpoint-stub.tick=off

# --- Carrier stub (external-outbound-kafka): DC → store / online FC ---
# Transit time: the carrier reports a shipment as arrived this long (± 20%) after the DC shipped it; until then it counts
# towards the location's inventory position, but not its stock. Below the stores' lead time of 1 demand period. 0 in
# tests and in the e2e dev server (playwright.config.ts) - the arrival is still an async Kafka round trip.
carrier-stub.transit-time=20s
%test.carrier-stub.transit-time=0s
# A shipment still in transit after this long is sent to the carrier again at the next period close
# (ShipmentCatchUpReceiver): its dispatch or arrival got lost. Arrivals are booked once, so this is harmless.
inventory.shipment-redispatch-after=2m

# =============================================================================
# Kafka inbound: delivery notifications from each supplier
# =============================================================================
#
# Unprocessable messages go to a dead-letter topic (<topic>-dlq) instead of stopping
# the channel; transient failures stop it (see docs/architecture/kafka-unprocessable-messages.md):
# - fail-on-deserialization-failure=false: a message the deserializer can't read
#   (invalid JSON, wrong field type) doesn't stop the consumer; SmallRye sends it to
#   the DLQ with its original bytes, the receiver never sees it.
# - failure-strategy=dead-letter-or-fail-stop (DeadLetterOrFailStop, inbound-kafka):
#   a message the receiver rejects with UnprocessableMessageException (tombstone,
#   broken structure) is nacked and sent to the DLQ as well. Any other exception is
#   transient (e.g. database down): the receiver's @Retry retries it, and if that
#   fails too the channel stops without committing, so the message is processed again
#   after a restart instead of landing in the DLQ.
# - dead-letter-queue.value.serializer must be set: SmallRye's default derives it from
#   the deserializer's class name (…DeliveryMessageSerializer), which doesn't exist.

mp.messaging.incoming.fruit-deliveries.topic=fruit-deliveries
mp.messaging.incoming.fruit-deliveries.value.deserializer=org.svenehrke.triptychdemo.feature.fruit.DeliveryMessageDeserializer
mp.messaging.incoming.fruit-deliveries.fail-on-deserialization-failure=false
mp.messaging.incoming.fruit-deliveries.failure-strategy=dead-letter-or-fail-stop
mp.messaging.incoming.fruit-deliveries.dead-letter-queue.topic=fruit-deliveries-dlq
mp.messaging.incoming.fruit-deliveries.dead-letter-queue.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.incoming.vegetables-deliveries.topic=vegetables-deliveries
mp.messaging.incoming.vegetables-deliveries.value.deserializer=org.svenehrke.triptychdemo.feature.vegetable.DeliveryMessageDeserializer
mp.messaging.incoming.vegetables-deliveries.fail-on-deserialization-failure=false
mp.messaging.incoming.vegetables-deliveries.failure-strategy=dead-letter-or-fail-stop
mp.messaging.incoming.vegetables-deliveries.dead-letter-queue.topic=vegetables-deliveries-dlq
mp.messaging.incoming.vegetables-deliveries.dead-letter-queue.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.incoming.dairy-deliveries.topic=dairy-deliveries
mp.messaging.incoming.dairy-deliveries.value.deserializer=org.svenehrke.triptychdemo.feature.dairy.DeliveryMessageDeserializer
mp.messaging.incoming.dairy-deliveries.fail-on-deserialization-failure=false
mp.messaging.incoming.dairy-deliveries.failure-strategy=dead-letter-or-fail-stop
mp.messaging.incoming.dairy-deliveries.dead-letter-queue.topic=dairy-deliveries-dlq
mp.messaging.incoming.dairy-deliveries.dead-letter-queue.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.incoming.beverages-deliveries.topic=beverages-deliveries
mp.messaging.incoming.beverages-deliveries.value.deserializer=org.svenehrke.triptychdemo.feature.beverage.DeliveryMessageDeserializer
mp.messaging.incoming.beverages-deliveries.fail-on-deserialization-failure=false
mp.messaging.incoming.beverages-deliveries.failure-strategy=dead-letter-or-fail-stop
mp.messaging.incoming.beverages-deliveries.dead-letter-queue.topic=beverages-deliveries-dlq
