mp.messaging.incoming.beverages-deliveries.fail-on-deserialization-failure=false
mp.messaging.incoming.beverages-deliveries.failure-strategy=dead-letter-or-fail-stop
mp.messaging.incoming.beverages-deliveries.dead-letter-queue.topic=beverages-deliveries-dlq
