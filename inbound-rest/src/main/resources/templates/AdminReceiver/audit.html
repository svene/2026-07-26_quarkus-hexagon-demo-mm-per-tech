<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Supermarket – Audit Log</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        h1 { border-bottom: 2px solid #333; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
        th { background: #f0f0f0; }
        nav a { margin-right: 1rem; }
    </style>
</head>
<body>
<h1>Supermarket – Audit Log</h1>
<nav><a href="/admin">Back to admin</a></nav>

{#if entries.isEmpty()}<p><em>No audit log entries yet.</em></p>{/if}
{#if !entries.isEmpty()}
<table>
    <thead>
        <tr><th>Timestamp</th><th>Event</th><th>Details</th></tr>
    </thead>
    <tbody>
        {#for e in entries}
        <tr>
            <td>{e.timestamp}</td>
            <td>{e.event}</td>
            <td>{e.details}</td>
        </tr>
        {/for}
    </tbody>
</table>
{/if}

</body>
</html>
