<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Supermarket – Shop</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        h1 { border-bottom: 2px solid #333; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
        th { background: #f0f0f0; }
        input[type=number] { padding: 4px 6px; width: 80px; }
        button { padding: 6px 14px; cursor: pointer; margin-top: 1rem; margin-right: 8px; }
        .dev-button { background: #f5f5f5; }
    </style>
</head>
<body>
<h1>Supermarket – Shop</h1>

{#if products.isEmpty()}
<p><em>No products available to purchase right now.</em></p>
{/if}

{#if !products.isEmpty()}
<form method="post" action="/shop/checkout" id="shop-form">
    <table>
        <thead>
            <tr><th>Name</th><th>Type</th><th>Available</th><th>Qty to buy</th></tr>
        </thead>
        <tbody>
            {#for p in products}
            <tr>
                <td>{p.name}</td>
                <td>{p.type}</td>
                <td>{p.availableAmount}</td>
                <td>
                    <input type="hidden" name="productName" value="{p.name}">
                    <input type="number" name="quantity" class="qty-input" min="0" max="{p.availableAmount}" data-max="{p.availableAmount}" value="">
                </td>
            </tr>
            {/for}
        </tbody>
    </table>
    <button type="submit">Purchase</button>
    <button type="button" id="randomize-btn" class="dev-button">Randomize (dev)</button>
</form>
{/if}

<script>
document.getElementById('randomize-btn')?.addEventListener('click', function () {
    var inputs = Array.from(document.querySelectorAll('.qty-input'));
    inputs.forEach(function (input) { input.value = ''; });
    if (inputs.length === 0) return;

    var count = Math.min(inputs.length, 2 + Math.floor(Math.random() * 3)); // 2-4
    var shuffled = inputs.slice().sort(function () { return Math.random() - 0.5; });
    shuffled.slice(0, count).forEach(function (input) {
        var max = Math.min(parseInt(input.dataset.max, 10) || 1, 10);
        input.value = 1 + Math.floor(Math.random() * max);
    });
});
</script>

</body>
</html>
